apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/gorbiel/software_engineering_web_project/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          volumeMounts:
            - name: backend-media
              mountPath: /app/media

          envFrom:
            - secretRef:
                name: postgres-secret

          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings

            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secret
                  key: SECRET_KEY

      volumes:
        - name: backend-media
          persistentVolumeClaim:
            claimName: backend-media
